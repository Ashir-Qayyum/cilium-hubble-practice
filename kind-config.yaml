# A basic kind cluster with 3 nodes
# - One control plane and two worker nodes for testing Cilium features
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
   - role: control-plane
     image: kindest/node:v1.29.14
   - role: worker
     image: kindest/node:v1.29.14
networking:
  disableDefaultCNI: true
